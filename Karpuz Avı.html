<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Karpuz Avı</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Rajdhani:wght@500;600;700&display=swap">
<style>
:root{--bg:#1d2b1f;--card:#26372a;--fg:#f4f1e8;--acc:#ffd23f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#101a12;--card:#1a2a1e}}
:root[data-theme="dark"]{--bg:#101a12;--card:#1a2a1e}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);overflow:hidden;font-family:system-ui,sans-serif}
canvas{display:block;width:100%;height:100%;cursor:crosshair;touch-action:none}
#ui{position:fixed;inset:0;display:none;align-items:flex-start;justify-content:center;background:#000a;overflow:auto;padding:16px;box-sizing:border-box}
.box{text-align:center;max-width:720px;width:100%;margin:auto 0}
h1,h2{font-family:'Bungee',Impact,sans-serif;margin:.2em 0;font-weight:400}
h1{font-size:clamp(40px,10vw,88px);color:#ef4444;text-shadow:0 4px 0 #7f1d1d,0 8px 18px #000}
h2{font-size:22px;color:var(--acc)}
.btn{font-family:'Bungee',Impact,sans-serif;font-size:18px;margin:8px;padding:12px 22px;border:0;border-radius:12px;background:var(--acc);color:#222;cursor:pointer;box-shadow:0 4px 0 #a07d00}
.btn.alt{background:#4ade80;box-shadow:0 4px 0 #1f8f48}
.btn:active{transform:translateY(3px);box-shadow:none}.btn:disabled{opacity:.5}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.it{background:var(--card);border-radius:12px;padding:10px}
.it i{display:block;width:44px;height:44px;border-radius:50%;margin:0 auto 6px;border:3px solid #0006}
.it b{display:block;font-size:14px}.it span{font-size:13px;color:var(--acc)}
.it button{margin-top:6px;border:0;border-radius:8px;padding:6px 12px;font-weight:700;cursor:pointer;background:#4ade80}
.it button:disabled{background:#556;color:#aaa;cursor:default}
.cz{background:radial-gradient(circle at 50% 0,#7a1020 0,#3b0a14 60%,#1a0509);border:4px solid #d4a017;border-radius:20px;padding:18px;box-shadow:0 0 30px #d4a01766 inset,0 10px 40px #000;color:#f4f1e8}
.neon{font-family:'Bungee',Impact,sans-serif;font-size:clamp(34px,8vw,64px);color:#ffe27a;text-shadow:0 0 8px #ffb300,0 0 22px #ff6a00,0 0 40px #ff2d55;animation:fl 2.5s infinite}
@keyframes fl{0%,100%{opacity:1}50%{opacity:.8}}
.bal{display:inline-block;background:#000a;border:2px solid #d4a017;border-radius:999px;padding:6px 16px;color:#ffe27a;font-weight:700;margin:8px 0}
.gc{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:14px 0}
.gk{background:linear-gradient(#2a0d14,#14060a);border:2px solid #d4a017;border-radius:16px;padding:16px 10px;color:#f4f1e8;cursor:pointer;font:inherit;transition:transform .15s,box-shadow .15s}
.gk:hover{transform:translateY(-4px);box-shadow:0 0 18px #ffb300}
.gk b{display:block;font-family:'Bungee',Impact,sans-serif;font-size:17px;color:#ffe27a;margin:6px 0 4px;font-weight:400}.gk em{font-size:34px;font-style:normal}.gk small{opacity:.8}
.felt{background:radial-gradient(#1f7a3d,#0e4a23);border:6px solid #5a3a1a;border-radius:24px;padding:14px;margin:10px 0;box-shadow:0 0 0 3px #d4a017 inset}
.slm{background:linear-gradient(#e6b422,#9a6b00);border-radius:22px;padding:14px;margin:10px auto;max-width:420px;box-shadow:0 8px 0 #5a3d00,0 0 30px #ffb30077}
.slm div.lbl{font-family:'Bungee',Impact,sans-serif;color:#5a1a00;margin-bottom:8px}
.rl{display:flex;gap:8px;background:#111;padding:10px;border-radius:14px}
.rl span{flex:1;background:linear-gradient(#ddd,#fff 50%,#ddd);border-radius:10px;font-size:54px;padding:8px 0;box-shadow:inset 0 0 12px #0006}
.pc{padding:0;width:62px;height:62px;border-radius:50%;border:4px dashed #fffa;font-weight:800;font-size:15px;color:#fff;cursor:pointer;margin:4px;box-shadow:0 4px 0 #0007}
.pc.on{outline:4px solid #ffe27a;transform:translateY(-4px)}.pc:disabled{opacity:.45;cursor:default}
.nb{width:38px;height:34px;margin:2px;border:2px solid #fff4;border-radius:6px;color:#fff;font-weight:700;cursor:pointer}
.farm{position:relative;overflow:hidden;background:linear-gradient(#8ed6ff 0,#d6f1ff 30%,#9bd96f 30%,#62ad3f 100%);border:6px solid #7a4a1e;border-radius:20px;padding:14px;box-shadow:0 10px 40px #000;color:#3b2208}
.farm>*{position:relative;z-index:1}.farm .dc{position:absolute;z-index:0;font-size:34px;opacity:.95;pointer-events:none}
.sign{display:inline-block;background:linear-gradient(#c88b45,#8a5522);border:4px solid #5a3612;border-radius:10px;padding:6px 22px;font-family:'Bungee',Impact,sans-serif;font-size:clamp(22px,5vw,36px);color:#fff3d6;text-shadow:0 3px 0 #4a2a0a;box-shadow:0 5px 0 #4a2a0a}
.fbal{display:inline-block;background:#fff8e0;border:3px solid #7a4a1e;border-radius:999px;padding:5px 16px;font-weight:800;margin:10px 0}
.pks{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:6px 0}
.pk{width:98px;border:3px solid #7a4a1e;border-radius:8px 8px 14px 14px;background:linear-gradient(#fff4d6,#efd8a0);padding:4px 4px 6px;cursor:pointer;font:inherit;font-size:12px;line-height:1.35;color:#4a2a0a;transition:transform .15s}
.pk b{display:block;font-family:'Bungee',Impact,sans-serif;font-weight:400;font-size:13px}
.pk.on{transform:translateY(-6px);box-shadow:0 0 0 3px #facc15,0 8px 0 #0003}
.fg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:8px 0}
.pl{position:relative;background:linear-gradient(#b5e58a,#8bc85e);border:3px solid #5a3612;border-radius:14px;padding:6px 6px 8px;box-shadow:0 4px 0 #4a2a0a}
.pl small{display:block;font-weight:700}
.trough{background:#5a3612;border-radius:8px;height:10px;margin:5px 4px;padding:2px;box-sizing:border-box}.trough div{background:linear-gradient(#8bf08b,#3fc04a);height:100%;border-radius:6px}
.fb{font-family:'Bungee',Impact,sans-serif;font-size:11px;border:0;border-radius:8px;padding:7px 10px;margin-top:4px;background:linear-gradient(#ffd166,#e0a126);color:#4a2a0a;box-shadow:0 3px 0 #8a5a10;cursor:pointer}
.fb:disabled{opacity:.55;box-shadow:none;cursor:default}.fb.red{background:linear-gradient(#ff9a9a,#e04646)}
.bird{position:absolute;top:2px;right:6px;font-size:28px;animation:hop .5s infinite alternate}@keyframes hop{to{transform:translateY(-8px) rotate(-8deg)}}
.rd{animation:bob 1.1s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-4px) scale(1.04)}}
.fence{height:16px;background:repeating-linear-gradient(90deg,#c58b4b 0 10px,transparent 10px 18px);border-top:4px solid #c58b4b;border-bottom:4px solid #a56f32;margin:6px 0}
.tut{background:linear-gradient(160deg,#16222b,#0a1118);border:2px solid #2dd4bf55;border-radius:18px;padding:18px;color:#e6edf3;font-family:'Rajdhani',system-ui,sans-serif;font-size:18px;font-weight:500;text-align:left;box-shadow:0 12px 40px #000a}
.tut h1{font-family:'Rajdhani',system-ui,sans-serif;font-size:32px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:#fff;text-shadow:none;margin:0 0 2px}
.tut .sub{color:#94a3b8;margin:0 0 12px}
.tut .pg{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.tut .cd{background:#ffffff0d;border:1px solid #ffffff22;border-radius:14px;padding:12px;display:flex;gap:12px;align-items:flex-start}
.tut .cd svg{flex:none;width:66px;height:66px}
.tut .cd b{display:block;font-size:19px;color:#5eead4;text-transform:uppercase;letter-spacing:1px}
.tut .cd p{margin:2px 0 0;line-height:1.25;color:#cbd5e1}
.tut .dots{text-align:center;margin:14px 0 4px}.tut .dots span{display:inline-block;width:10px;height:10px;border-radius:50%;background:#ffffff33;margin:0 4px}.tut .dots .on{background:#5eead4}
.key{display:inline-block;min-width:22px;padding:1px 7px;border-radius:6px;background:linear-gradient(#f8fafc,#cbd5e1);color:#0f172a;font-weight:700;box-shadow:0 3px 0 #64748b;margin:0 2px;text-align:center;font-size:15px}
.tb{font-family:'Rajdhani',system-ui,sans-serif;font-weight:700;font-size:18px;letter-spacing:1px;text-transform:uppercase;border:0;border-radius:10px;padding:10px 24px;margin:6px;background:linear-gradient(#2dd4bf,#0d9488);color:#042f2e;cursor:pointer;box-shadow:0 3px 0 #0a5d56}
.tb.alt{background:linear-gradient(#475569,#334155);color:#e2e8f0;box-shadow:0 3px 0 #1e293b}
</style></head><body>

<script>
const c=document.getElementById('c'),g=c.getContext('2d'),ui=document.getElementById('ui'),box=document.getElementById('box');
const FONT="'Bungee',Impact,sans-serif";
let W,H;function rs(){W=c.width=c.clientWidth;H=c.height=c.clientHeight}addEventListener('resize',rs);rs();
/* ---- ses ---- */
let ac,mg,nb;
function A(){if(!ac){ac=new(window.AudioContext||window.webkitAudioContext)();mg=ac.createGain();mg.gain.value=SV.vol;const cp=ac.createDynamicsCompressor();mg.connect(cp);cp.connect(ac.destination);
nb=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}if(ac.state==='suspended')ac.resume();return ac}
function snd(f,d,ty='square',v=.06,f2,dl=0){try{const a=A(),o=a.createOscillator(),n=a.createGain(),t=a.currentTime+dl;o.type=ty;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
n.gain.setValueAtTime(.0001,t);n.gain.exponentialRampToValueAtTime(v,t+.008);n.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(n);n.connect(mg);o.start(t);o.stop(t+d+.02)}catch(e){}}
function nz(d,f0,f1,v=.2,ty='lowpass',q=1,dl=0){try{const a=A(),s=a.createBufferSource(),fl=a.createBiquadFilter(),n=a.createGain(),t=a.currentTime+dl;s.buffer=nb;s.loop=true;fl.type=ty;fl.Q.value=q;fl.frequency.setValueAtTime(f0,t);fl.frequency.exponentialRampToValueAtTime(f1,t+d);
n.gain.setValueAtTime(v,t);n.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(fl);fl.connect(n);n.connect(mg);s.start(t);s.stop(t+d+.02)}catch(e){}}
const seq=(a,ty,d,v=.08,gap=.09)=>a.forEach((f,i)=>snd(f,d,ty,v,0,i*gap));
const S={
shoot:w=>{if(w==='pom'){nz(.35,3500,150,.5,'lowpass');snd(90,.3,'sine',.4,35);nz(.06,8000,2000,.25,'highpass')}
else if(w==='mak'){nz(.07,5000,600,.22,'bandpass',.9);snd(700,.05,'sawtooth',.05,150)}

over:()=>{seq([392,370,349,311],'sawtooth',.35,.09,.3);snd(80,.7,'sine',.3,35,1.1)},
ui:()=>snd(700,.05,'triangle',.05,1000),
tick:()=>{snd(1200+Math.random()*300,.03,'square',.025);nz(.02,3000,1500,.05,'highpass')},
stop:()=>{snd(180,.1,'square',.1,90);nz(.06,2000,300,.2)},
card:()=>nz(.07,5000,1500,.2,'bandpass',1.5),
chip:()=>{snd(2200,.04,'sine',.06,1400);snd(1500,.05,'triangle',.05,900,.03)},
jack:()=>{seq([523,659,784,1047,784,1047,1319],'square',.18,.06,.1);seq([1047,1319,1568,2093],'triangle',.3,.05,.75);for(let i=0;i<6;i++)setTimeout(S.coin,i*120)},
lose:()=>seq([330,262],'triangle',.25,.08,.18),
click:()=>{nz(.03,6000,2000,.3,'highpass');snd(1800,.02,'square',.06)},
spin:()=>{for(let i=0;i<9;i++)setTimeout(S.click,i*70)},

/* ---- kayıt ---- */
let SV={gold:0,own:['mavi','klasik'],pc:'mavi',ec:'klasik',up:{hp:0,sp:0,fr:0,gm:0},wp:'pist',ownw:['pist'],q:[],tk:0,map:0,mus:1,hat:'h_yok',gs:'s_yok',bf:'f_yok',bd:[],jp:0,bjn:0,gp:0,dif:1,vol:.9,bk:0,farm:{u:4,p:Array.from({length:9},()=>({s:null}))},fs:'k',fh:0,fo:0,tut:0};
try{Object.assign(SV,JSON.parse(localStorage.getItem('karpuz')||'{}'))}catch(e){}
['h_yok','s_yok','f_yok'].forEach(x=>{if(!SV.own.includes(x))SV.own.push(x)});

const WP={pist:{n:'Tabanca',cd:.14,pl:1,sp:.03,dmg:1},mak:{n:'Makineli',cd:.06,pl:1,sp:.14,dmg:1},pom:{n:'Pompalı',cd:.55,pl:6,sp:.45,dmg:1},del:{n:'Delici Tüfek',cd:.28,pl:1,sp:0,dmg:2,pierce:1}};
const UP=[{id:'hp',n:'Maks. Can',d:'+10 can',b:1500},{id:'sp',n:'Hareket Hızı',d:'+%6 hız',b:1200},{id:'fr',n:'Ateş Hızı',d:'+%8 hız',b:1800},{id:'gm',n:'Altın Çarpanı',d:'+%20 altın',b:2500}];
const WS=[{id:'pist',n:'Tabanca',p:0,c:'#888'},{id:'mak',n:'Makineli',p:75000,c:'#e67e22'},{id:'pom',n:'Pompalı',p:30000,c:'#c0392b'},{id:'del',n:'Delici Tüfek',p:35000,c:'#8e44ad'}];

let run={k:0,kit:0},lastBoss=0,frz=0,ebl=[],score=0,tch=0,js=null,fid=null,ast=null;
const QS=[{id:'k50',n:'Tek oyunda 50 karpuz öldür',r:2500,f:()=>run.k>=50},{id:'w5',n:'5. dalgaya ulaş',r:1500,f:()=>score>=60},{id:'kit5',n:'Tek oyunda 5 sağlık kiti topla',r:2000,f:()=>run.kit>=5},{id:'k120',n:'Tek oyunda 120 karpuz öldür',r:7500,f:()=>run.k>=120},{id:'tk500',n:'Toplam 500 karpuz öldür',r:6000,f:()=>SV.tk>=500}];
const HT=[{id:'h_yok',n:'Şapkasız',p:0,c:'#666'},{id:'h_kov',n:'Kovboy Şapkası',p:4000,c:'#8b5a2b'},{id:'h_sil',n:'Silindir Şapka',p:7000,c:'#111'},{id:'h_ksk',n:'Savaş Kaskı',p:9000,c:'#6b7280'},{id:'h_tac',n:'Altın Taç',p:20000,c:'#facc15'}];
const GS=[{id:'s_yok',n:'Standart',p:0,c:'#444',k:null},{id:'s_kir',n:'Kırmızı Kaplama',p:5000,c:'#dc2626',k:'#dc2626'},{id:'s_neon',n:'Neon Mavi',p:8000,c:'#22d3ee',k:'#22d3ee'},{id:'s_alt',n:'Altın Kaplama',p:15000,c:'#d4a017',k:'#d4a017'},{id:'s_elm',n:'Elmas',p:30000,c:'#a5f3fc',k:'#a5f3fc'}];

{id:'b4',i:'🌊',n:'Dalga Avcısı',d:'10. dalgaya ulaş',f:()=>score>=135},{id:'b5',i:'🎰',n:'Jackpot!',d:'Slotta jackpot yap',f:()=>SV.jp>=1},{id:'b6',i:'🃏',n:'Blackjack',d:'Doğal blackjack yap',f:()=>SV.bjn>=1},
{id:'b7',i:'🎲',n:'Kumarbaz',d:'Gazinoda 25 oyun oyna',f:()=>SV.gp>=25},{id:'b8',i:'💰',n:'Zengin',d:'100.000 altına ulaş',f:()=>SV.gold>=100000},{id:'b9',i:'🔫',n:'Silah Ustası',d:'Tüm silahları satın al',f:()=>SV.ownw.length>=4},{id:'b12',i:'🌱',n:'Çiftçi',d:'50 karpuz hasat et',f:()=>SV.fh>=50},{id:'b11',i:'👹',n:'Boss Avcısı',d:'Bir boss karpuzu yen',f:()=>SV.bk>=1},{id:'b10',i:'👑',n:'Moda Ustası',d:'Marketten 7 eşya satın al',f:()=>SV.own.length>=12}];
const DIF=[{n:'Kolay',s:.8,i:1.35,d:.6,g:.7,b:.7},{n:'Normal',s:1,i:1,d:1,g:1,b:1},{n:'Zor',s:1.25,i:.75,d:1.5,g:1.6,b:1.5}];

const PW={sh:['🛡️','#38bdf8','Kalkan'],ic:['❄️','#a5f3fc','Dondurma'],bm:['💣','#f97316','Bomba'],sp:['👟','#a3e635','Hız Botu'],x2:['💰','#facc15','Çift Altın']};

const K=x=>`<span class="key">${x}</span>`;
const TUT=[
{t:'Kontroller',s:'Bilgisayarda ve telefonda nasıl oynanır',c:[[I.keys,'Hareket',`${K('W')}${K('A')}${K('S')}${K('D')} veya ok tuşlarıyla hareket et.`],[I.mouse,'Nişan ve ateş','Fareyle nişan al, sol tuşu basılı tutarak ateş et.'],[I.phone,'Telefon','Sol başparmak hareket ettirir. Sağ başparmakla çubuğu ateş edeceğin yöne it.'],[I.pause,'Duraklat',`${K('Esc')} veya ${K('P')} tuşu, ya da sağ üstteki duraklat düğmesi.`]]},
{t:'Amaç ve düşmanlar',s:'Hayatta kal, karpuzları avla',c:[[I.target,'Amaç','Karpuzları vur. Her 15 karpuzda dalga artar, her 5. dalgada boss gelir.'],[I.fast,'Hızlı karpuz','Küçük ve çok çevik, hızla üstüne koşar.'],[I.split,'Bölünen karpuz','Ölünce iki küçük karpuza ayrılır.'],[I.shoot,'Atıcı karpuz','Yaklaşıp durur ve uzaktan mermi atar.'],[I.big,'Büyük karpuz','Daha çok can taşır, çarpınca çok hasar verir.'],[I.boss,'Boss','Taçlı dev karpuz. Küçük karpuzlar doğurur, çok güçlüdür.']]},
{t:'Eşyalar ve güçler',s:'Haritada beliren eşyaları üstünden geçerek topla',c:[[I.heart,'Can','Canını 10 yeniler.'],[I.crate,'Silah kutusu','Kısa süre rastgele bir silah verir.'],[I.shield,'Kalkan','8 saniye hasar almazsın.'],[I.ice,'Dondurma','5 saniye tüm karpuzlar yavaşlar.'],[I.bomb,'Bomba','Ekrandaki karpuzları patlatır.'],[I.boot,'Hız botu','10 saniye daha hızlı koşarsın.'],[I.x2,'Çift altın','15 saniye boyunca iki kat altın.']]},
{t:'Altın ve gelişim',s:'Kazandığın altını akıllıca harca',c:[[I.coin,'Altın','Her karpuz altın düşürür, altınlar sayacına uçar.'],[I.bag,'Market','Silah, kostüm, şapka, kurşun efekti ve geliştirme satın al.'],[I.dice,'Gazino','Slot, 21, rulet, zar ve daha fazlası. Bahisler altınla.'],[I.sprout,'Çiftlik','80.000 altınla aç. Karpuz yetiştir, hasat et, kuşları kov.'],[I.medal,'Rozetler','Görevleri tamamla, rozetleri topla.']]}];
function tutRender(){ui.style.display='flex';const P=TUT[TP];icn=0;
box.innerHTML=`<div class="tut"><h1>${P.t}</h1><div class="sub">${P.s}</div><div class="pg">${P.c.map(([ic,n,d])=>`<div class="cd">${ic()}<div><b>${n}</b><p>${d}</p></div></div>`).join('')}</div><div class="dots">${TUT.map((_,i)=>`<span class="${i===TP?'on':''}"></span>`).join('')}</div><div style="text-align:center">${TP>0?'<button class="tb alt" data-a="tut_p">Geri</button>':''}${TP<TUT.length-1?'<button class="tb" data-a="tut_n">İleri</button>':'<button class="tb" data-a="tutok">Başla</button>'}<br><button class="tb alt" data-a="tutok" style="font-size:14px;padding:6px 14px">Kapat</button></div></div>`}
box.addEventListener('input',e=>{if(e.target.dataset.a==='vol'){SV.vol=e.target.value/100;if(mg)mg.gain.value=SV.vol;save()}});
box.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,id=b.dataset.id;if(a==='vol')return;if(a!=='g_bet'&&a!=='play')S.ui();if(a==='tut'){TP=0;tutRender();return}if(a==='tut_n'){TP++;tutRender();return}if(a==='tut_p'){TP--;tutRender();return}if(a==='tutok'){SV.tut=1;save();show(scr);return}if(a==='farm'){FM='';if(SV.fo){SV.farm.p.forEach(pl=>{if(pl.pest)pl.pt=Date.now()});farmRender()}else farmBuy();return}if(a.startsWith('f_')){fz(a,b.dataset);return}if(a==='cas'){G.v='menu';G.msg='';rg();return}if(a.startsWith('g_')){gz(a,b.dataset);return}
if(a==='resume'){st='play';m.d=false;ui.style.display='none';startMusic();return}if(a==='quit'){st='menu';show('menu');return}
if(a==='play')start();else if(a==='shop'||a==='quests')show(a);else if(a==='back')show(scr);
else if(a==='map'){SV.map=(SV.map+1)%MP.length;save();show(scr)}
else if(a==='dif'){SV.dif=(SV.dif+1)%3;save();show(scr)}
else if(a==='mus'){SV.mus=SV.mus?0:1;save();show(st==='pause'?'pause':scr)}
else if(a==='up'){const l=SV.up[id],cs=UP.find(z=>z.id===id).b*(l+1);if(l<5&&SV.gold>=cs){SV.gold-=cs;SV.up[id]++;S.buy();save();show('shop')}}
else if(a==='wp'){const x=WS.find(z=>z.id===id);if(!SV.ownw.includes(id)){if(SV.gold<x.p)return;SV.gold-=x.p;SV.ownw.push(id);S.buy()}SV.wp=id;save();show('shop')}
else if(a==='buy'){const L={pc:PC,ec:EC,hat:HT,gs:GS,bf:BF}[b.dataset.t],x=L.find(z=>z.id===id);if(!SV.own.includes(x.id)){if(SV.gold<x.p)return;SV.gold-=x.p;SV.own.push(x.id);S.buy()}SV[b.dataset.t]=x.id;save();show('shop')}});
let last=performance.now();
(function loop(n){const dt=Math.min(.05,(n-last)/1000);last=n;shake=Math.max(0,shake-dt*30);if(st==='play')update(dt);g.save();if(shake>0)g.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);draw();g.restore();drawNight();drawTouch();requestAnimationFrame(loop)})(last);
(document.fonts&&document.fonts.load('20px Bungee')||Promise.resolve()).finally(()=>{if(SV.tut)show('menu');else{TP=0;tutRender()}});
</script></body></html>
